apiVersion: v1
kind: Service
metadata:
  name: bps-operator-webhook-service
  namespace: bps-operator-system
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: webhook-server-cert
spec:
  ports:
    - name: webhook
      port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    app.kubernetes.io/name: bps-operator
