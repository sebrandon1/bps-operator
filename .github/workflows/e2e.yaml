name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * *" # Nightly at 04:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  e2e:
    name: Kind
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install controller-gen
        run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@latest

      - name: Create Kubernetes cluster
        uses: palmsoftware/quick-k8s@a3fb344d489e5cadf379208a80f291cbcdbd0a0d # v1.0.9
        with:
          numControlPlaneNodes: 1
          numWorkerNodes: 1
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run e2e tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 30
          retry_wait_seconds: 60
          command: |
            make test-e2e IMG=quay.io/redhat-best-practices-for-k8s/bps-operator:e2e

      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
          kubectl wait --for=condition=Available deployment --all -n cert-manager --timeout=180s

      - name: Run webhook e2e
        run: make test-e2e-webhook
