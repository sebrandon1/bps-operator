# bps-operator validating webhook manifest (certmanager)
# Generated by: make install-webhook-yaml WEBHOOK_VARIANT=certmanager
# Apply with: kubectl apply -f install-webhook.yaml, then enable it with: make enable-webhook
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bps-operator-selfsigned-issuer
  namespace: bps-operator-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bps-operator-webhook-cert
  namespace: bps-operator-system
spec:
  dnsNames:
    - bps-operator-webhook-service.bps-operator-system.svc
    - bps-operator-webhook-service.bps-operator-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: bps-operator-selfsigned-issuer
  secretName: webhook-server-cert
---
apiVersion: v1
kind: Service
metadata:
  name: bps-operator-webhook-service
  namespace: bps-operator-system
spec:
  ports:
    - name: webhook
      port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    app.kubernetes.io/name: bps-operator
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: bps-operator-validating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: bps-operator-system/bps-operator-webhook-cert
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: bps-operator-webhook-service
        namespace: bps-operator-system
        path: /validate-bps-openshift-io-v1alpha1-bestpracticescanner
    # Ignore keeps scanner CRUD working if the webhook Service is unavailable.
    failurePolicy: Ignore
    name: vbestpracticescanner.kb.io
    rules:
      - apiGroups:
          - bps.openshift.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - bestpracticescanners
    sideEffects: None
